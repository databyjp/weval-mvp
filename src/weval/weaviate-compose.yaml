# yaml-language-server: $schema=none
# Compose overlay applied after shared-compose.yaml to every Trial environment
# whose task.toml does not set `[metadata] weaviate_workspace = false`. It names
# the Weaviate endpoints that those Tasks' WORKSPACE.md, snapshot.py, and
# Oracle read.
---
services:
  main:
    environment:
      WEAVIATE_HTTP_HOST: weaviate
      WEAVIATE_HTTP_PORT: "8080"
      WEAVIATE_GRPC_HOST: weaviate
      WEAVIATE_GRPC_PORT: "50051"
