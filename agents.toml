# Named Agents: one agent harness plus one model. `weval run --agent <name>`.
# Quote names containing dots. Keys other than `harness` are passed to that harness module in src/weval/harnesses/.

[oracle]
harness = "oracle"

["pi-glm-5.3-flash"]
harness = "pi"
version = "0.85.1"
model = "openrouter/z-ai/glm-5.3-flash"

["claude-code-haiku-5.5"]
harness = "claude-code"
# npm "stable" tag on 2026-10-16; "latest" was 2.1.301.
version = "2.1.292"
model = "anthropic/claude-haiku-5-5"
auth = "subscription"

["claude-code-sonnet-5.5"]
harness = "claude-code"
version = "2.1.292"
model = "anthropic/claude-sonnet-5-5"
auth = "subscription"

["claude-code-opus-5.5"]
harness = "claude-code"
version = "2.1.292"
model = "anthropic/claude-opus-5-5"
# Claude subscription via CLAUDE_CODE_OAUTH_TOKEN (`claude setup-token`), not OpenRouter.
auth = "subscription"
