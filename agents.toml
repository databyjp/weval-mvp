# Named Agents: one agent harness plus one model. `weval run --agent <name>`.
# Quote names containing dots. Keys other than `harness` are passed to that harness module in src/weval/harnesses/.

[oracle]
harness = "oracle"

["pi-glm-5.3-flash"]
harness = "pi"
version = "0.85.1"
model = "openrouter/z-ai/glm-5.3-flash"

["pi-glm-5.3"]
harness = "pi"
version = "0.85.1"
model = "openrouter/z-ai/glm-5.3"

["pi-minimax-m3.1-flash"]
harness = "pi"
version = "0.85.1"
model = "openrouter/minimax/minimax-m3.1-flash"

["pi-deepseek-v4.1-flash-1017"]
harness = "pi"
version = "0.85.1"
model = "openrouter/deepseek/deepseek-v4.1-flash-1017"

["pi-gpt-6.1-terra"]
harness = "pi"
version = "0.85.1"
model = "openrouter/openai/gpt-6.1-terra"

["opencode-deepseek-v4.1-flash-1017"]
harness = "opencode"
# opencode-ai 1.19.4 (2026-10-22); 1.19.5 was a day old. Same model as the Pi Agent.
version = "1.19.4"
model = "openrouter/deepseek/deepseek-v4.1-flash-1017"

["pi-claude-sonnet-5.5"]
harness = "pi"
version = "0.85.1"
model = "openrouter/anthropic/claude-sonnet-5.5"

["claude-code-haiku-5.5"]
harness = "claude-code"
# npm "stable" tag on 2026-10-16; "latest" was 2.1.301.
version = "2.1.292"
model = "anthropic/claude-haiku-5-5"
auth = "subscription"

["claude-code-sonnet-5.5"]
harness = "claude-code"
version = "2.1.292"
model = "anthropic/claude-sonnet-5-5"
auth = "subscription"

["claude-code-opus-5.5"]
harness = "claude-code"
version = "2.1.292"
model = "anthropic/claude-opus-5-5"
# Claude subscription via CLAUDE_CODE_OAUTH_TOKEN (`claude setup-token`), not OpenRouter.
auth = "subscription"
