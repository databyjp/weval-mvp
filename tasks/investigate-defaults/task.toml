# Harbor task config. weval adds tests/.
artifacts = [{ source = "/app", destination = "submission" }]

[agent]
timeout_sec = 1200.0

[verifier]
timeout_sec = 900.0
# The audit is scored against the live deployment; there is no application.
env = { WEVAL_KEEP_STACK = "1" }

[environment]
build_timeout_sec = 900.0

# The entrypoint starts the inherited deployment, then creates this marker.
# Waiting for it keeps the agent from auditing a deployment still starting.
[environment.healthcheck]
command = "test -f /tmp/weval-deployment-ready"
interval_sec = 5.0
start_period_sec = 240.0
retries = 3
