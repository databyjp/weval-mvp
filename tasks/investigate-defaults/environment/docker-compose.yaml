# yaml-language-server: $schema=none
---
services:
  main:
    environment:
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME}_submission
      TRIAL_NETWORK: ${COMPOSE_PROJECT_NAME}_default
      WEAVIATE_HTTP_HOST: weaviate
      WEAVIATE_HTTP_PORT: "8080"
      WEAVIATE_GRPC_HOST: weaviate
      WEAVIATE_GRPC_PORT: "50051"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: [CMD, test, -f, /tmp/weval-deployment-ready]
      interval: 2s
      timeout: 2s
      retries: 120
