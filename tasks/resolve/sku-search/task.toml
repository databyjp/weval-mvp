# Harbor task config. weval adds tests/.
artifacts = [{ source = "/app", destination = "submission" }]

[metadata]
draft = true

[agent]
timeout_sec = 1200.0

[verifier]
timeout_sec = 900.0
# Score the agent's live stack: its Weaviate volume holds the catalog under test.
env = { WEVAL_KEEP_STACK = "1", WEVAL_START_APP = "1" }

[environment]
build_timeout_sec = 900.0

# The entrypoint seeds the catalog and confirms the SKU failure reproduces,
# then creates this marker.
[environment.healthcheck]
command = "test -f /tmp/weval-catalog-ready"
interval_sec = 5.0
start_period_sec = 240.0
retries = 3
