# yaml-language-server: $schema=none
---
services:
  weaviate:
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --scheme
      - http
    image: >-
      cr.weaviate.io/semitechnologies/weaviate:1.39.5@sha256:c29b501d8fdab55d8b3fbe8c3db78e286ba0708536e7039d894d01a84ca6ba8b
    restart: on-failure:0
    environment:
      QUERY_DEFAULTS_LIMIT: "25"
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      ENABLE_MODULES: text2vec-transformers
      CLUSTER_HOSTNAME: node1
      TRANSFORMERS_INFERENCE_API: http://text2vec-transformers:8080
    volumes:
      - weaviate_data:/var/lib/weaviate
    depends_on:
      text2vec-transformers:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - --spider
        - --quiet
        - http://localhost:8080/v1/.well-known/ready
      interval: 2s
      timeout: 2s
      retries: 90

  text2vec-transformers:
    image: >-
      cr.weaviate.io/semitechnologies/transformers-inference:snowflake-snowflake-arctic-embed-m@sha256:dc246a0e2119232b0f0adad4f61347ed5a0933a0f37cb6c0fbe6170e8966c2bf
    environment:
      ENABLE_CUDA: "0"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen(
          'http://localhost:8080/.well-known/ready', timeout=2)
      interval: 2s
      timeout: 3s
      retries: 90

volumes:
  weaviate_data:

networks:
  default:
    external: true
    name: ${TRIAL_NETWORK}
