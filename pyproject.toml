[project]
name = "weval"
version = "0.0.1"
description = "Runs Weaviate coding Tasks against agent harnesses and scores each Trial"
readme = "README.md"
authors = [
    { name = "JP Hwang", email = "me@jphwang.com" }
]
requires-python = ">=3.13"
dependencies = [
    "anthropic>=2.3.0",
    "harbor[modal]>=0.23.0",
    "httpx>=0.28.1",
    "modal[api-proxy-support]>=1.6.1",
    "pygments>=2.21.0",
]

[project.scripts]
weval = "weval.cli:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
